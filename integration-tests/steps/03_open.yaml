group: BBC / FS / OPENBAS

disk: openbas.ssd

paste:
  - 'PRINT "Running openbas tests"'
  - '*CAT'
  - '*FHOST'
  - '*FLS'

steps:
  - name: opin01
    paste:
      - 'CHAIN "OPIN01"'
    delay_seconds: 5.0
    checks:
      - screen:
          expect:
            regex:
              - 'HELLO'
  - name: opin02
    paste:
      - 'CHAIN "OPIN02"'
    delay_seconds: 5.0
    checks:
      - screen:
          expect:
            regex:
              - 'FujiNet OPENIN BGET Test'
  - name: opout01
    paste:
      - 'CHAIN "OPOUT01"'
    delay_seconds: 5.0
    checks:
      - screen:
          expect:
            regex:
              - 'ABC'
