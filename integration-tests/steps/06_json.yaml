group: BBC / Network / JSON strings

disk: openbas.ssd

paste:
  - 'PRINT "Running JSON tests"'
  - '*FUJI'
  - '*CAT'

steps:
  - name: fnjsonq
    paste:
      - 'CH."FNJSONQ"'
    delay_seconds: 8.0
    checks:
      - screen:
          expect:
            regex:
              - 'FujiNet FJSON test'
              - 'Handle    : [1-2][0-9]+'
              - 'ReadLen   : 29'
              - 'String : http://192.168.1.101:8080/get'
  - name: fnjson2
    paste:
      - 'CH."FNJSON2"'
    delay_seconds: 10.0
    checks:
      - screen:
          expect:
            regex:
              - 'FujiNet multi JSON query test'
              - 'Handle    : [1-2][0-9]+'
              - 'url query stat: 0'
              - 'url Len: 29'
              - 'String : http://192.168.1.101:8080/get'
              - 'headers/Host query stat: 0'
              - 'headers/Host Len: 18'
              - 'String : 192.168.1.101:8080'
  - name: fnosw78
    paste:
      - 'CH."FNOSW78"'
    delay_seconds: 8.0
    checks:
      - screen:
          expect:
            regex:
              - 'FujiNet OSWORD 78 Test'
              - 'Handle    : [1-2][0-9]+'
              - 'ReadLen   : 29'
              - 'String : http://192.168.1.101:8080/get'
