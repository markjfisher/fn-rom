group: BBC / Network / JSON strings

disk: openbas.ssd

paste:
  - 'PRINT "Running JSON tests"'
  - '*FUJI'
  - '*CAT'

steps:
  - name: fnjson0
    paste:
      - 'CH."FNJSON0"'
    delay_seconds: 8.0
    checks:
      - screen:
          expect:
            regex:
              - 'FujiNet missing JSON path test'
              - 'Handle    : [1-2][0-9]+'
              - 'ReadLen   : 0'
              - 'Empty     : yes'
  - name: fnjsonq
    paste:
      - 'CH."FNJSONQ"'
    delay_seconds: 8.0
    checks:
      - screen:
          expect:
            regex:
              - 'FujiNet FJSON test'
              - 'Handle    : [1-2][0-9]+'
              - 'ReadLen   : {HTTPBIN_GET_LEN}'
              - 'String : {HTTPBIN_GET_URL}'
  - name: fnjson2
    paste:
      - 'CH."FNJSON2"'
    delay_seconds: 10.0
    checks:
      - screen:
          expect:
            regex:
              - 'FujiNet multi JSON query test'
              - 'Handle    : [1-2][0-9]+'
              - 'url query stat: 0'
              - 'url Len: {HTTPBIN_GET_LEN}'
              - 'String : {HTTPBIN_GET_URL}'
              - 'headers/Host query stat: 0'
              - 'headers/Host Len: {HTTPBIN_NETLOC_LEN}'
              - 'String : {HTTPBIN_NETLOC}'
  - name: fnosw78
    paste:
      - 'CH."FNOSW78"'
    delay_seconds: 8.0
    checks:
      - screen:
          expect:
            regex:
              - 'FujiNet OSWORD 78 Test'
              - 'Handle    : [1-2][0-9]+'
              - 'ReadLen   : {HTTPBIN_GET_LEN}'
              - 'String : {HTTPBIN_GET_URL}'
