group: BBC / FS / Long strings

disk: openbas.ssd

paste:
  - 'PRINT "Running long string tests"'
  - '*FUJI'
  - '*CAT'

steps:
  - name: fnpost01_basic_post
    paste:
      - 'CHAIN "FNPOST1"'
    delay_seconds: 8.0
    checks:
      - screen:
          expect:
            regex:
              - 'FujiNet POST body test'
              - 'Body length: [0-9]+'
              - 'Set body len status: 0'
              - 'Write data status: 0'
              - 'Method query status: 0'
              - 'Method result: POST'
              - 'POST response received'
  - name: opin03_long_url
    paste:
      - 'CHAIN "OPIN03"'
    delay_seconds: 8.0
    checks:
      - screen:
          expect:
            regex:
              - 'Long URL OPENIN test'
              - 'URL length: 2[0-4][0-9]'
              - 'FujiNet OPENIN BGET Test'
  - name: fnnet01_long_json
    paste:
      - 'CHAIN "FNNET1"'
    delay_seconds: 8.0
    checks:
      - screen:
          expect:
            regex:
              - 'FujiNet long JSON path test'
              - 'Path length: 200'
              - 'Long JSON path status: 0'
              - 'Long JSON path sent'
