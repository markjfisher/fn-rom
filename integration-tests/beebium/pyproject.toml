[project]
name = "fnrom-beebium-tests"
version = "0.0.0"
description = "End-to-end serial/PTY tests for fn-rom running under the Beebium BBC emulator"
requires-python = ">=3.11"

# beebium is not on PyPI — test runners pass BEEBIUM_HOME/clients/python via
# `uv run --with-editable` (see run_pytest.sh). grpcio/protobuf match beebium.
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "pyserial>=3.5",
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
]

[tool.pytest.ini_options]
addopts = "-ra -p no:beebium"
timeout = 120
