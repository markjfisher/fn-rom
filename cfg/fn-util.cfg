# Linker config for standalone BBC FN-BOOT.ssd transient-utility binaries
# (role-split Lever B disk execution). The command's kernel/disk imports are
# resolved to fixed ROM addresses via a generated rom_abi.o; only the command's
# own code + duplicated utils-internal helpers live in the binary, loaded into
# RAM and entered there by the FS *RUN.
#
# scripts/build_fn_boot.sh generates the active config per machine:
# BBC=$1900, Master=$0E00.
MEMORY {
    ZP:  file = "", start = $0000, size = $0100, type = rw;
    RAM: file = %O, start = $1900, size = $3700, fill = no;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  optional = yes;
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro,  optional = yes;
    RO_EARLY: load = RAM, type = ro,  optional = yes;
    HEADER:   load = RAM, type = ro,  optional = yes;
    DATA:     load = RAM, type = rw,  optional = yes;
    BSS:      load = RAM, type = bss, optional = yes;
}
