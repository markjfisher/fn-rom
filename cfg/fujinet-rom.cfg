FEATURES {
    STARTADDRESS: default = $8000;
}
SYMBOLS {
    __WORKSPACE_START__:   type = weak,     value = $1500;
    __WORKSPACE_END__:     type = weak,     value = $1900; #; may need to have multiple cfg files for different PAGE targets
}
MEMORY {
    ZP:       file = "", define = yes, start = $0000, size = $0100;
    HEADER_MEM: file = %O, define = yes, start = %S,    size = $0030, fill = yes, fillval = $00;
    UTILABI:    file = %O, define = yes, start = $8030, size = $00D0, fill = yes, fillval = $00;
    MAIN:       file = %O, define = yes, start = $8100, size = $3F00, fill = yes, fillval = $00; #; Sideways ROM from 8000 to $BFFF
    WORKSP:   file = "", define = yes, start = __WORKSPACE_START__, size = __WORKSPACE_END__ - __WORKSPACE_START__; # ; up to PAGE - TODO will need some looking at when multi-machine, e.g. master
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    HEADER:   load = HEADER_MEM, type = ro;
    UTILABI:  load = UTILABI,  type = ro;
    #; $8030..$80FF is the stable utility ABI jump table. Keep normal ROM code
    #; from $8100 upward so transient utilities can call fixed veneers.
    RO_EARLY: load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    #; Command tables (see macros.inc cmd_entry, ROM_ROLE_SPLIT_PLAN §5.3).
    #; Per-group paired segments: CMDADR_<grp> holds .word handler-1 per entry,
    #; CMDSTR_<grp> holds the matched text + param bytes. CMDSTR_<grp>_T carries the
    #; one-byte $00 terminator so a feature module appending entries into a group
    #; (e.g. cmd_free_map.s -> FUJIFS) still lands its commands *before* the $00.
    #; A group's base segment (CMDSTR_<grp>/CMDADR_<grp>) has a single owner
    #; (cmd_tables.s), so its start label is reliably the first byte regardless of
    #; object link order. Feature modules that *extend* a group append into the
    #; contiguous _EXT segment (e.g. cmd_free_map.s -> FUJIFS_EXT). The one-byte
    #; CMDSTR_<grp>_T carries the $00 terminator after any extension.
    #; FUTILS is placed last so the help printer can tell an "F"-prefixed command
    #; by a single (entry >= cmd_str_futils) compare, in both the *HELP loop and
    #; the per-command syntax-error usage print.
    CMDADR_FUJIFS:     load = MAIN, type = ro;
    CMDADR_FUJIFS_EXT: load = MAIN, type = ro, optional = yes;
    CMDADR_UTILS:  load = MAIN, type = ro;
    CMDADR_FS:     load = MAIN, type = ro;
    CMDADR_HELP:   load = MAIN, type = ro;
    CMDADR_FUTILS:     load = MAIN, type = ro;
    CMDADR_FUTILS_EXT: load = MAIN, type = ro, optional = yes;
    CMDSTR_FUJIFS:     load = MAIN, type = ro;
    CMDSTR_FUJIFS_EXT: load = MAIN, type = ro, optional = yes;
    CMDSTR_FUJIFS_T:   load = MAIN, type = ro;
    CMDSTR_UTILS:    load = MAIN, type = ro;
    CMDSTR_UTILS_T:  load = MAIN, type = ro;
    CMDSTR_FS:       load = MAIN, type = ro;
    CMDSTR_FS_T:     load = MAIN, type = ro;
    CMDSTR_HELP:     load = MAIN, type = ro;
    CMDSTR_HELP_T:   load = MAIN, type = ro;
    CMDSTR_FUTILS:     load = MAIN, type = ro;
    CMDSTR_FUTILS_EXT: load = MAIN, type = ro, optional = yes;
    CMDSTR_FUTILS_T:   load = MAIN, type = ro;
    CODE:     load = MAIN,     type = ro;
    DATA:     load = WORKSP,   type = rw;  #; a place to put our variables with initial state
    BSS:      load = WORKSP,   type = bss, define = yes, optional = yes; #; general BSS variables, zeroed when *FUJI is called, also used for C Stack Pointer, from the end
}
