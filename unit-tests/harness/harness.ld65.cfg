# Link osbyte_stub.o into a flat binary starting at $1BFE.
# Build:
#   ca65 -t none -o osbyte_stub.o osbyte_stub.s
#   ld65 -C harness.ld65.cfg osbyte_stub.o -o osbyte_stub.bin -m osbyte_stub.map

MEMORY {
    HARNESS:        start = $1900, size = $1000, file = %O;
    MOS_VECTORS_M:  start = $FFB9, size =    65, file = %O, define = no;
    V_RST:          start = $FFFC, size =     2, file = %O, define = no;
}
FILES {
    %O: format = atari;
}
SEGMENTS {
    STARTUP:        load = HARNESS,         type = ro, define = yes;
    CODE:           load = HARNESS,         type = rw, define = yes;
    MOS_VECTORS:    load = MOS_VECTORS_M,   type = ro, define = yes;
    V_RESET:        load = V_RST,           type = ro, define = yes;
}